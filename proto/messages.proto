syntax = "proto3";

package messages;

// SteamVR feeder bridge protocol (the SlimeVRInput Unix socket). WiVRn connects
// and announces trackers (HMD/controllers) via TrackerAdded, then streams their
// 6-DoF poses via Position. Only the fields the server needs are declared;
// unknown oneof variants/fields are skipped by protobuf.
message ProtobufMessage {
  oneof message {
    Position position = 1;
    TrackerAdded tracker_added = 3;
    PingPong ping_pong = 6;
    Version version = 7;
  }
}

message Position {
  int32 tracker_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float qx = 5;
  float qy = 6;
  float qz = 7;
  float qw = 8;
  int32 data_source = 9;
  float vx = 10;
  float vy = 11;
  float vz = 12;
}

message TrackerAdded {
  int32 tracker_id = 1;
  string tracker_serial = 2;
  string tracker_name = 3;
  int32 tracker_role = 4;
  string manufacturer = 5;
}

message PingPong {
  int32 ping_id = 1;
}

message Version {
  uint32 protocol_version = 1;
}
